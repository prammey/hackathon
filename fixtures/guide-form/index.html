<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank complaint form</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  .picker { min-width: 260px; padding: 10px 12px; border: 1px solid #888; background: #fff; text-align: left; font-size: 16px; }
  /* Like select2: the list is drawn on <body>, away from the button. */
  .picker-list { position: absolute; list-style: none; margin: 0; padding: 4px 0; background: #fff; border: 1px solid #888; box-shadow: 0 6px 18px rgba(0,0,0,.2); width: 260px; }
  .picker-list li { padding: 10px 12px; cursor: pointer; }
  .picker-list li:hover { background: #e8f0ff; }
  .next { margin-top: 32px; padding: 10px 24px; font-size: 16px; }
</style>
</head>
<body>
  <h1>File a complaint about your bank</h1>
  <p>Answer each question, then press Continue.</p>
  <form action="step2.html" onsubmit="return document.getElementById('answer').value !== ''">
    <p><label id="q-label">Have you already contacted your bank about this problem?</label></p>
    <button type="button" class="picker" id="picker" aria-haspopup="listbox" aria-labelledby="q-label">-- None --</button>
    <input type="hidden" name="contacted" id="answer" value="">
    <p><button class="next" type="submit">Continue</button></p>
  </form>
  <script>
    const picker = document.getElementById("picker");
    let list = null;
    picker.addEventListener("click", () => {
      if (list) { list.remove(); list = null; return; }
      list = document.createElement("ul");
      list.className = "picker-list";
      list.setAttribute("role", "listbox");
      const r = picker.getBoundingClientRect();
      list.style.left = `${r.left + scrollX}px`;
      list.style.top = `${r.bottom + scrollY + 40}px`;
      for (const option of ["Yes", "No"]) {
        const li = document.createElement("li");
        li.setAttribute("role", "option");
        li.textContent = option;
        li.addEventListener("click", () => {
          picker.textContent = option;
          document.getElementById("answer").value = option;
          list.remove(); list = null;
        });
        list.append(li);
      }
      document.body.append(list);
    });
  </script>
</body>
</html>
