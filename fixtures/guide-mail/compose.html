<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>New message – Bluemail</title>
<style>
body{margin:0;font:13px Arial,sans-serif;background:#f6f8fc}
.box{position:fixed;right:24px;bottom:0;width:520px;background:#fff;border-radius:8px 8px 0 0;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.box h2{margin:0;padding:10px 14px;font-size:14px;background:#f2f6fc;border-radius:8px 8px 0 0}
.box input,.box textarea{display:block;width:100%;box-sizing:border-box;border:0;border-bottom:1px solid #eee;padding:10px 14px;font:inherit}
.box textarea{height:220px;resize:none;border:0}
.bar{display:flex;gap:8px;padding:10px 14px}
.send{background:#0b57d0;color:#fff;border:0;border-radius:18px;padding:9px 22px;font-weight:600}
</style></head><body>
<form class="box" action="sent.html" method="get">
  <h2>New message</h2>
  <input name="to" aria-label="To" placeholder="To">
  <input name="subject" aria-label="Subject" placeholder="Subject">
  <textarea name="body" aria-label="Message body"></textarea>
  <div class="bar"><button class="send" type="submit">Send</button><button type="button">Formatting</button><button type="button">Attach</button><button type="button" aria-label="Discard draft">🗑</button></div>
</form>
</body></html>
