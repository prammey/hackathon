<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ashbridge Bins — your collections (fictional app)</title>
<style>
  body { margin: 0; font: 13px "Helvetica Neue", Arial, sans-serif; background: #111827; color: #9ca3af; }
  #app-bar { display: flex; gap: 6px; padding: 8px 12px; background: #1f2937; position: sticky; top: 0; }
  #app-bar a { color: #93c5fd; font-size: 12px; text-decoration: none; padding: 4px 8px; border-radius: 4px; }
  #app-bar a.active { background: #374151; color: #fff; }
  #clock { margin-left: auto; color: #6b7280; font-size: 11px; }
  #view { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: #1f2937; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
  .card h3 { margin: 0 0 4px; color: #e5e7eb; font-size: 14px; }
  .pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; background: #065f46; color: #a7f3d0; }
  button { background: #2563eb; color: #fff; border: 0; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
  .feed-item { font-size: 11px; border-bottom: 1px solid #374151; padding: 4px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>document.write('<script src="' + location.pathname.slice(0, location.pathname.indexOf("/dynamic-app/")) + '/dynamic-app/app.js"><\/script>')</script>
</body>
</html>
